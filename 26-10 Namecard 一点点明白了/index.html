<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>will i am - Business Card</title>
    
    <!-- Importing bold typography reminiscent of classic print posters -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Link to your external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <!-- Bold Typographic Name -->
        <div class="name-lockup">
            <span class="will">will <span class="red">i</span> am</span>
          
        </div>

        <!-- Geometric Graphic & Text -->
        <div class="middle-section">
            <div class="graphic-replacement">
                <div class="red-square"></div>
                <div class="halftone-circle"></div>
            </div>
            <div class="text-content">
                <p class="tagline">Aspiring to<br>be better</p>
                <p class="chinese">一点点明白了。</p>
            </div>
        </div>

        <!-- Footer / Printer's Mark -->
        <div class="footer">
            <div class="circle"></div>
            <div class="square"></div>
            <div class="footer-text">Est. 2026</div>
        </div>
    </div>

</body>
</html>
